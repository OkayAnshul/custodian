[project]
name = "custodian"
version = "0.1.0"
description = "The purpose layer for agentic commerce: re-derive what the agent bought before money moves."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.40",
    "razorpay>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "contract: shared suite every PaymentGateway implementation must pass",
    "live: requires real Razorpay test-mode credentials",
]
